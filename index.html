<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<script>
(function(){
  try{
    var t = localStorage.getItem('promoTheme');
    if(t !== 'light' && t !== 'dark'){
      t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){}
})();
</script>
<title>Active Promotions — Al-Mohanna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Kufi+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* ---- light theme (default) ---- */
  --bg:#f3f4fb;
  --bg-deep:#ffffff;
  --card:rgba(23,25,51,0.035);
  --card-hover:rgba(23,25,51,0.065);
  --border:rgba(88,66,214,0.16);
  --border-strong:rgba(88,66,214,0.34);
  --ink:#181a33;
  --muted:#5b5e80;
  --muted-dim:#888cab;
  --violet:#5433d6;
  --blue:#0a6d8a;
  --pink:#b8215d;
  --gold:#9a6406;
  --grad1:rgba(109,79,255,0.14);
  --grad2:rgba(10,109,138,0.12);
  --grad3:rgba(184,33,93,0.09);
  --noise-dot:rgba(20,20,50,0.045);
  --sel-bg:rgba(84,51,214,0.22);
  --sel-ink:#14152c;
  --h1-start:var(--ink);
  --toolbar-bg:rgba(255,255,255,0.82);
  --panel-bg:#ffffff;
  --on-brand:#ffffff;
  --select-arrow:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6"><path d="M0 0l5 6 5-6z" fill="%235b5e80"/></svg>');
  --font-display:'Space Grotesk', system-ui, sans-serif;
  --font-sans:'Inter', system-ui, -apple-system, sans-serif;
  --font-mono:'IBM Plex Mono', ui-monospace, monospace;
  --font-ar:'Noto Kufi Arabic', system-ui, sans-serif;
  --radius-s:4px;
  --radius-m:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a0b1f;
    --bg-deep:#050614;
    --card:rgba(255,255,255,0.045);
    --card-hover:rgba(255,255,255,0.075);
    --border:rgba(151,140,255,0.18);
    --border-strong:rgba(151,140,255,0.4);
    --ink:#eceeff;
    --muted:#9297c2;
    --muted-dim:#6a6f96;
    --violet:#8b6bff;
    --blue:#4fd6ff;
    --pink:#ff5fa8;
    --gold:#ffcf6b;
    --grad1:rgba(139,107,255,0.32);
    --grad2:rgba(79,214,255,0.22);
    --grad3:rgba(255,95,168,0.16);
    --noise-dot:rgba(255,255,255,0.035);
    --sel-bg:rgba(139,107,255,0.45);
    --sel-ink:#ffffff;
    --h1-start:#ffffff;
    --toolbar-bg:rgba(10,11,31,0.82);
    --panel-bg:#0c0e24;
    --on-brand:#0a0b1f;
    --select-arrow:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6"><path d="M0 0l5 6 5-6z" fill="%239297c2"/></svg>');
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a0b1f;
  --bg-deep:#050614;
  --card:rgba(255,255,255,0.045);
  --card-hover:rgba(255,255,255,0.075);
  --border:rgba(151,140,255,0.18);
  --border-strong:rgba(151,140,255,0.4);
  --ink:#eceeff;
  --muted:#9297c2;
  --muted-dim:#6a6f96;
  --violet:#8b6bff;
  --blue:#4fd6ff;
  --pink:#ff5fa8;
  --gold:#ffcf6b;
  --grad1:rgba(139,107,255,0.32);
  --grad2:rgba(79,214,255,0.22);
  --grad3:rgba(255,95,168,0.16);
  --noise-dot:rgba(255,255,255,0.035);
  --sel-bg:rgba(139,107,255,0.45);
  --sel-ink:#ffffff;
  --h1-start:#ffffff;
  --toolbar-bg:rgba(10,11,31,0.82);
  --panel-bg:#0c0e24;
  --on-brand:#0a0b1f;
  --select-arrow:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6"><path d="M0 0l5 6 5-6z" fill="%239297c2"/></svg>');
  color-scheme:dark;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-sans);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  position:relative;
  transition:background .2s, color .2s;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-2;
  background:
    radial-gradient(700px 480px at 12% -10%, var(--grad1), transparent 60%),
    radial-gradient(650px 500px at 88% 8%, var(--grad2), transparent 60%),
    radial-gradient(600px 460px at 50% 115%, var(--grad3), transparent 65%),
    var(--bg-deep);
}
body::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  opacity:0.5;
  background-image:radial-gradient(var(--noise-dot) 1px, transparent 1px);
  background-size:26px 26px;
}
::selection{background:var(--sel-bg);color:var(--sel-ink);}
a{color:inherit;}
button{font-family:inherit;}

/* ---------- Header ---------- */
.masthead{
  padding:40px 28px 26px;
  position:relative;
  border-bottom:1px solid var(--border);
}
.masthead-row{
  max-width:1320px;
  margin:0 auto;
}
.brandmark{
  display:inline-flex;align-items:center;gap:8px;
  font-family:var(--font-mono);
  font-size:12px;
  letter-spacing:0.14em;
  color:var(--blue);
  border:1px solid var(--border-strong);
  padding:5px 12px;
  border-radius:20px;
  text-transform:uppercase;
  background:rgba(79,214,255,0.06);
}
.brandmark .dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--blue);
  box-shadow:0 0 8px 2px rgba(79,214,255,0.8);
}
h1{
  font-family:var(--font-display);
  font-size:clamp(30px,4.6vw,44px);
  font-weight:700;
  margin:16px 0 4px;
  letter-spacing:-0.01em;
  line-height:1.08;
  background:linear-gradient(100deg, var(--h1-start) 20%, var(--blue) 55%, var(--violet) 85%);
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
}
.subtitle{
  font-family:var(--font-ar);
  font-size:15px;
  color:var(--muted);
  direction:rtl;
  margin:0;
}
.meta-line{
  font-size:13.5px;
  color:var(--muted);
  margin-top:10px;
}
.meta-line strong{color:var(--ink);font-weight:600;}

/* ---------- Toolbar ---------- */
.toolbar{
  position:sticky;top:0;z-index:20;
  background:var(--toolbar-bg);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
  padding:14px 28px;
}
.toolbar-inner{
  max-width:1320px;margin:0 auto;
  display:flex;flex-direction:column;gap:10px;
}
.search-row{
  display:flex;gap:10px;align-items:center;
}
.scan-btn, .theme-btn{
  flex-shrink:0;
  width:44px;height:44px;
  display:flex;align-items:center;justify-content:center;
  border:1.5px solid var(--border-strong);
  border-radius:var(--radius-m);
  background:rgba(139,107,255,0.08);
  color:var(--blue);
  cursor:pointer;
  transition:background .15s, box-shadow .15s;
}
.scan-btn:hover, .theme-btn:hover{
  background:rgba(139,107,255,0.18);
  box-shadow:0 0 16px rgba(79,214,255,0.2);
}
.scan-btn svg{width:20px;height:20px;}
.theme-btn svg{width:20px;height:20px;display:none;}
.theme-btn .icon-moon{display:block;}
:root[data-theme="dark"] .theme-btn .icon-sun{display:block;}
:root[data-theme="dark"] .theme-btn .icon-moon{display:none;}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .theme-btn .icon-sun{display:block;}
  :root:not([data-theme="light"]) .theme-btn .icon-moon{display:none;}
}

/* ---------- Scanner modal ---------- */
.scan-overlay{
  position:fixed;inset:0;
  background:rgba(5,6,20,0.85);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  display:none;
  align-items:center;justify-content:center;
  z-index:100;
  padding:20px;
}
.scan-overlay.open{display:flex;}
.scan-modal{
  width:100%;max-width:420px;
  background:var(--panel-bg);
  border:1.5px solid var(--border-strong);
  border-radius:14px;
  padding:18px;
  box-shadow:0 0 40px rgba(139,107,255,0.25);
  position:relative;
}
.scan-modal-head{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:12px;
}
.scan-modal-head h2{
  font-family:var(--font-display);
  font-size:16px;margin:0;color:var(--ink);
}
.scan-close{
  background:none;border:none;color:var(--muted);
  font-size:20px;line-height:1;cursor:pointer;
  padding:4px 8px;
}
.scan-close:hover{color:var(--ink);}
.scan-video-wrap{
  position:relative;
  border-radius:10px;
  overflow:hidden;
  background:#000;
  aspect-ratio:4/3;
}
.scan-video-wrap video{
  width:100%;height:100%;object-fit:cover;display:block;
}
.scan-reticle{
  position:absolute;inset:18% 10%;
  border:2px solid var(--blue);
  border-radius:8px;
  box-shadow:0 0 0 999px rgba(0,0,0,0.35);
  pointer-events:none;
}
.scan-status{
  margin-top:12px;
  font-family:var(--font-mono);
  font-size:12.5px;
  color:var(--muted);
  text-align:center;
}
.search-box{
  flex:1;
  position:relative;
}
.search-box input{
  width:100%;
  font-family:var(--font-sans);
  font-size:15px;
  padding:11px 14px 11px 38px;
  border:1.5px solid var(--border);
  border-radius:var(--radius-m);
  background:var(--card);
  color:var(--ink);
  outline:none;
  transition:border-color .15s, box-shadow .15s;
}
.search-box input::placeholder{color:var(--muted-dim);}
.search-box input:focus{
  border-color:var(--violet);
  box-shadow:0 0 0 3px rgba(139,107,255,0.15);
}
.search-box svg{
  position:absolute;left:12px;top:50%;transform:translateY(-50%);
  width:16px;height:16px;color:var(--muted);pointer-events:none;
}
.result-count{
  font-family:var(--font-mono);
  font-size:12.5px;
  color:var(--blue);
  white-space:nowrap;
  min-width:112px;
  text-align:right;
}
.filters-row{
  display:flex;gap:8px;flex-wrap:wrap;align-items:center;
}
select{
  font-family:var(--font-sans);
  font-size:13.5px;
  padding:8px 30px 8px 12px;
  border:1.5px solid var(--border);
  border-radius:var(--radius-m);
  background:var(--card) var(--select-arrow) no-repeat right 12px center;
  color:var(--ink);
  appearance:none;
  cursor:pointer;
  max-width:180px;
}
select option{background:var(--panel-bg);color:var(--ink);}
select:focus{outline:none;border-color:var(--violet);}
.clear-btn{
  font-size:13px;
  color:var(--pink);
  background:none;
  border:1px solid transparent;
  padding:8px 10px;
  cursor:pointer;
  border-radius:var(--radius-m);
  font-weight:600;
}
.clear-btn:hover{background:rgba(255,95,168,0.1);}
.date-filter{
  display:flex;align-items:center;gap:8px;
  padding:3px;
  border:1px dashed var(--border);
  border-radius:var(--radius-m);
}
.date-field{
  display:flex;align-items:center;gap:6px;
  font-size:12px;
  color:var(--muted);
  white-space:nowrap;
}
input[type="date"]{
  font-family:var(--font-sans);
  font-size:13.5px;
  padding:7px 10px;
  border:1.5px solid var(--border);
  border-radius:var(--radius-m);
  background:var(--card);
  color:var(--ink);
  cursor:pointer;
}
input[type="date"]:focus{outline:none;border-color:var(--violet);}

/* ---------- Group headers ---------- */
.group-header{
  grid-column:1/-1;
  display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  margin-top:16px;
  padding-bottom:6px;
  border-bottom:1px solid var(--border-strong);
}
.group-header:first-child{margin-top:0;}
.group-header{cursor:pointer;user-select:none;}
.group-header:hover h2{color:var(--violet);}
.group-header:focus-visible{outline:2px solid var(--violet);outline-offset:4px;border-radius:var(--radius-s);}
.group-chevron{
  width:16px;height:16px;
  flex-shrink:0;
  align-self:center;
  color:var(--muted);
  transition:transform .15s;
}
.group-header.collapsed .group-chevron{transform:rotate(-90deg);}
.toggle-all-btn{color:var(--violet);}
.toggle-all-btn:hover{background:rgba(139,107,255,0.1);}
.group-header.sub{
  margin:6px 0 0 24px;
  padding-bottom:4px;
  border-bottom:1px dashed var(--border);
}
.group-header h3{
  font-family:var(--font-display);
  font-size:14.5px;
  font-weight:600;
  margin:0;
  color:var(--ink);
}
.group-header:hover h3{color:var(--violet);}
select[hidden]{display:none;}
.group-header h2{
  font-family:var(--font-display);
  font-size:17px;
  font-weight:600;
  margin:0;
  color:var(--ink);
}
.group-count{
  font-family:var(--font-mono);
  font-size:12px;
  color:var(--blue);
}
.group-note{
  font-size:12px;
  font-weight:600;
  color:var(--pink);
}

/* ---------- Grid ---------- */
main{max-width:1320px;margin:0 auto;padding:26px 28px 60px;}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(272px,1fr));
  gap:14px;
}
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius-m);
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:9px;
  position:relative;
  backdrop-filter:blur(6px);
  transition:border-color .15s, background .15s, transform .15s;
}
.card:hover{
  border-color:var(--border-strong);
  background:var(--card-hover);
}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.brand-tag{
  font-family:var(--font-mono);
  font-size:11px;
  letter-spacing:0.05em;
  color:var(--blue);
  font-weight:600;
  text-transform:uppercase;
}
.subgroup-tag{
  font-size:11px;
  color:var(--muted);
  background:rgba(255,255,255,0.04);
  border:1px solid var(--border);
  padding:2px 8px;
  border-radius:20px;
  white-space:nowrap;
}
.item-name{
  font-family:var(--font-display);
  font-size:15px;
  font-weight:600;
  line-height:1.35;
  margin:0;
  color:var(--ink);
}
.item-name-ar{
  font-family:var(--font-ar);
  font-size:14px;
  color:var(--muted);
  direction:rtl;
  text-align:right;
  line-height:1.5;
  margin:0;
}
.tag-row{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}
.ending-tag{
  align-self:flex-start;
  font-size:11.5px;
  font-weight:600;
  color:var(--pink);
  background:rgba(255,95,168,0.1);
  border:1px solid rgba(255,95,168,0.3);
  padding:3px 9px;
  border-radius:20px;
}
.new-tag{
  align-self:flex-start;
  font-size:11.5px;
  font-weight:700;
  color:var(--blue);
  background:rgba(79,214,255,0.1);
  border:1px solid rgba(79,214,255,0.35);
  padding:3px 9px;
  border-radius:20px;
}
.price-row{
  display:flex;
  align-items:baseline;
  gap:8px;
  flex-wrap:wrap;
  margin-top:auto;
  padding-top:10px;
  border-top:1px dashed var(--border);
}
.offer-chip{
  margin-left:auto;
  font-family:var(--font-sans);
  font-size:11.5px;
  font-weight:600;
  color:var(--violet);
  background:rgba(139,107,255,0.1);
  border:1px solid rgba(139,107,255,0.35);
  padding:3px 10px;
  border-radius:20px;
  white-space:normal;
  text-align:right;
  line-height:1.3;
}
.price-now{
  font-family:var(--font-mono);
  font-size:17px;
  font-weight:600;
  color:var(--gold);
}
.price-was{
  font-family:var(--font-mono);
  font-size:12.5px;
  color:var(--muted-dim);
  text-decoration:line-through;
}
.card-footer{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-family:var(--font-mono);
  font-size:10.5px;
  color:var(--muted-dim);
}
.card-footer .code{color:var(--violet);}
.empty-state{
  grid-column:1/-1;
  text-align:center;
  padding:70px 20px;
  color:var(--muted);
}
.empty-state .glyph{font-size:34px;display:block;margin-bottom:10px;color:var(--violet);}
.empty-state button{
  margin-top:14px;
  background:linear-gradient(100deg, var(--violet), var(--blue));
  color:var(--on-brand);
  border:none;
  padding:9px 18px;
  border-radius:var(--radius-m);
  font-weight:700;
  cursor:pointer;
}

.load-more-wrap{
  display:flex;
  justify-content:center;
  margin-top:26px;
}
.load-more{
  background:rgba(255,255,255,0.03);
  border:1.5px solid var(--border-strong);
  color:var(--ink);
  font-weight:700;
  font-size:14px;
  padding:12px 30px;
  border-radius:var(--radius-m);
  cursor:pointer;
  transition:background .15s, box-shadow .15s;
}
.load-more:hover{
  background:linear-gradient(100deg, rgba(139,107,255,0.25), rgba(79,214,255,0.2));
  box-shadow:0 0 24px rgba(139,107,255,0.25);
}

@media(max-width:640px){
  .masthead{padding:28px 16px 20px;}
  .toolbar{padding:12px 16px;}
  main{padding:18px 16px 50px;}
  .filters-row{display:grid;grid-template-columns:1fr 1fr;}
  select{max-width:none;width:100%;min-width:0;}
  .date-filter{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:end;}
  .date-field{flex-direction:column;align-items:stretch;gap:3px;min-width:0;}
  .date-field input{width:100%;min-width:0;}
}
</style>
</head>
<body>
<header class="masthead">
  <div class="masthead-row">
    <span class="brandmark"><span class="dot"></span>Al-Mohanna Pharmacies</span>
    <h1>Active Promotions</h1>
    <p class="subtitle">دليل العروض النشطة — تصفح وابحث عن المنتجات المخفضة</p>
    <p class="meta-line">Live directory of <strong id="totalCount">—</strong> promoted items across <strong id="brandCount">—</strong> brands.</p>
  </div>
</header>

<div class="toolbar">
  <div class="toolbar-inner">
    <div class="search-row">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="searchInput" type="text" placeholder="Search by item name, brand, code or barcode…" autocomplete="off">
      </div>
      <button class="scan-btn" id="scanBtn" title="Scan barcode" type="button" aria-label="Scan barcode">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><line x1="7" y1="8" x2="7" y2="16"/><line x1="10" y1="8" x2="10" y2="16"/><line x1="13" y1="8" x2="13" y2="16"/><line x1="17" y1="8" x2="17" y2="16"/></svg>
      </button>

const loadMoreBtn = document.getElementById('loadMoreBtn');
const clearBtn = document.getElementById('clearBtn');
const toggleAllBtn = document.getElementById('toggleAllBtn');

function uniqueSorted(key){
  const s = new Set();
  DATA.forEach(r => { if(r[key]) s.add(r[key]); });
  return Array.from(s).sort((a,b)=>a.localeCompare(b));
}

function populateSelect(sel, values){
  values.forEach(v=>{
    const opt = document.createElement('option');
    opt.value = v; opt.textContent = v;
    sel.appendChild(opt);
  });
}

function fmtDate(d){
  if(!d) return '';
  const dt = new Date(d+'T00:00:00');
  return dt.toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'});
}

function daysLeft(endDate){
  if(!endDate) return null;
  const end = new Date(endDate+'T00:00:00');
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.ceil((end - today) / 86400000);
}

function escapeHtml(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function computeDiscountPct(r){
  if(r.discPct) return r.discPct;
  if(r.priceTax && r.priceAfterDisc && r.priceTax > 0){
    return Math.round((1 - r.priceAfterDisc/r.priceTax) * 100);
  }
  return 0;
}

let MAX_ACT_DATE = null;

function cardHtml(r){
  const finalPrice = r.priceAfterDisc || r.priceTax;
  const showWas = r.priceAfterDisc && r.priceTax && r.priceAfterDisc < r.priceTax;
  const days = daysLeft(r.endDate);
  const endingSoon = days !== null && days <= 7 && days >= 0;
  const isNew = r.actDate && MAX_ACT_DATE && (MAX_ACT_DATE - new Date(r.actDate+'T00:00:00')) <= 3*86400000;
  return `<div class="card">
    <div class="card-top">
      <span class="brand-tag">${escapeHtml(r.brand||'')}</span>
      ${r.subGroup ? `<span class="subgroup-tag">${escapeHtml(r.subGroup)}</span>` : ''}
    </div>
    <p class="item-name">${escapeHtml(r.nameEn)}</p>
    ${r.nameAr ? `<p class="item-name-ar">${escapeHtml(r.nameAr)}</p>` : ''}
    <div class="tag-row">
      ${isNew ? `<span class="new-tag">New</span>` : ''}
      ${endingSoon ? `<span class="ending-tag">Ends in ${days}d</span>` : ''}
    </div>
    <div class="price-row">
      <span class="price-now">SAR ${finalPrice != null ? finalPrice.toFixed(2) : '—'}</span>
      ${showWas ? `<span class="price-was">SAR ${r.priceTax.toFixed(2)}</span>` : ''}
      ${r.offer ? `<span class="offer-chip">${escapeHtml(r.offer)}</span>` : ''}
    </div>
    <div class="card-footer">
      <span class="code">#${escapeHtml(r.code)}</span>
      <span>until ${fmtDate(r.endDate)}</span>
    </div>
  </div>`;
}

function sortCompare(a, b, sort){
  if(sort === 'name') return (a.nameEn||'').localeCompare(b.nameEn||'');
  if(sort === 'brand') return (a.brand||'').localeCompare(b.brand||'');
  if(sort === 'priceAsc') return (a.priceAfterDisc||a.priceTax||0) - (b.priceAfterDisc||b.priceTax||0);
  if(sort === 'priceDesc') return (b.priceAfterDisc||b.priceTax||0) - (a.priceAfterDisc||a.priceTax||0);
  if(sort === 'discount') return computeDiscountPct(b) - computeDiscountPct(a);
  if(sort === 'ending') return new Date(a.endDate) - new Date(b.endDate);
  if(sort === 'recent') return new Date(b.actDate) - new Date(a.actDate);
  return 0;
}

// ---------- Grouping ----------
// Up to two levels (Group, then "Then by"), e.g. End date > Brand. Items are
// sorted by level 1, then level 2, then the chosen sort; a header is drawn
// whenever a level's key changes, so "Show more" keeps appending into the
// right group. A group's id is its level plus the full key path, so a brand
// under two different end dates is two separate groups.
// Collapsed groups are skipped while rendering and don't count toward
// PAGE_SIZE, so "Collapse all" shows every top-level header at once as a
// compact index. Toggling a header re-renders (keeping as many cards as were
// on screen) so paging stays consistent.
const SEP = '␟';
let groupLevels = [];             // e.g. ['endDate', 'brand']
let groupCounts = new Map();      // group id -> item count
let topGroupIds = [];             // level-1 ids in display order
let collapsedGroups = new Set();  // ids of collapsed groups
let collapsedMode = '';           // grouping the collapsed set belongs to
let lastGroupIds = [];
const CHEVRON = '<svg class="group-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>';

function keyFor(level, r){
  return level === 'brand' ? (r.brand || '') : (r.endDate || '');
}

function groupIdsFor(r){
  let path = '';
  return groupLevels.map((lvl, i) => { path += SEP + keyFor(lvl, r); return (i + 1) + path; });
}

function compareLevel(level, a, b){
  const ka = keyFor(level, a), kb = keyFor(level, b);
  if(ka === kb) return 0;
  if(!ka) return 1;           // items without a brand / end date go last
  if(!kb) return -1;
  return level === 'brand' ? ka.localeCompare(kb) : (ka < kb ? -1 : 1);
}

function groupCompare(a, b){
  for(const lvl of groupLevels){
    const c = compareLevel(lvl, a, b);
    if(c) return c;
  }
  return 0;
}

// "Then by" offers only the field not already used by "Group", and is hidden
// until a first level is chosen.
function syncThenSelect(){
  const first = groupSelect.value;
  thenSelect.hidden = !first;
  [...thenSelect.options].forEach(o => { o.disabled = !!o.value && o.value === first; });
  if(!first || thenSelect.value === first) thenSelect.value = '';
  groupLevels = [first, thenSelect.value].filter(Boolean);
}

function groupHeaderHtml(level, depth, key, id){
  const n = groupCounts.get(id) || 0;
  const count = `<span class="group-count">${n} item${n===1?'':'s'}</span>`;
  const collapsed = collapsedGroups.has(id);
  const tag = depth === 1 ? 'h2' : 'h3';
  const open = `<div class="group-header${depth > 1 ? ' sub' : ''}${collapsed ? ' collapsed' : ''}" data-gid="${escapeHtml(id)}" role="button" tabindex="0" aria-expanded="${!collapsed}">${CHEVRON}`;
  if(level === 'brand'){
    return `${open}<${tag}>${escapeHtml(key || 'No brand')}</${tag}>${count}</div>`;
  }
  if(!key) return `${open}<${tag}>No end date</${tag}>${count}</div>`;
  const d = daysLeft(key);
  const note = d < 0 ? 'Ended' : d === 0 ? 'Ends today' : `${d} day${d===1?'':'s'} left`;
  return `${open}<${tag}>Ends ${fmtDate(key)}</${tag}>${count}<span class="group-note">${note}</span></div>`;
}

function updateToggleAllBtn(){
  toggleAllBtn.hidden = groupLevels.length === 0 || topGroupIds.length === 0;
  const allCollapsed = topGroupIds.length > 0 && topGroupIds.every(id => collapsedGroups.has(id));
  toggleAllBtn.textContent = allCollapsed ? 'Expand all' : 'Collapse all';
}

function rerender(focusId){
  const target = Math.max(PAGE_SIZE, grid.querySelectorAll('.card').length);
  shown = 0;
  renderPage(true, target);
  updateToggleAllBtn();
  if(focusId){
    const h = [...grid.querySelectorAll('.group-header')].find(x => x.dataset.gid === focusId);
    if(h) h.focus({preventScroll:true});
  }
}

function toggleGroup(header){
  const id = header.dataset.gid;
  if(collapsedGroups.has(id)) collapsedGroups.delete(id); else collapsedGroups.add(id);
  rerender(document.activeElement === header ? id : null);
}

// Collapse all folds every level, so opening an end date shows its brands
// folded too (a list of brands with counts).
function toggleAllGroups(){
  const allCollapsed = topGroupIds.every(id => collapsedGroups.has(id));
  collapsedGroups = allCollapsed ? new Set() : new Set(groupCounts.keys());
  shown = 0;
  renderPage(true);
  updateToggleAllBtn();
}

// Calendars only offer dates that exist for the chosen field, and From / To
// can't cross each other.
function updateDateBounds(){
  const vals = DATA.map(r=>r[dateField.value]).filter(Boolean).sort();
  const lo = vals[0] || '', hi = vals[vals.length - 1] || '';
  dateFromInput.min = lo;
  dateFromInput.max = dateToInput.value || hi;
  dateToInput.min = dateFromInput.value || lo;
  dateToInput.max = hi;
}

function applyFilters(){
  const q = searchInput.value.trim().toLowerCase();
  const cat = categoryFilter.value;
  const brand = brandFilter.value;
  const type = typeFilter.value;
  const offer = offerFilter.value;
  // date inputs give 'YYYY-MM-DD', the same format as actDate/endDate,
  // so plain string comparison orders them correctly
  const dField = dateField.value;
  const dFrom = dateFromInput.value;
  const dTo = dateToInput.value;

  filtered = DATA.filter(r=>{
    if(cat && r.subGroup !== cat) return false;
    if(brand && r.brand !== brand) return false;
    if(type && r.type !== type) return false;
    if(offer && r.offer !== offer) return false;
    if(dFrom && (!r[dField] || r[dField] < dFrom)) return false;
    if(dTo && (!r[dField] || r[dField] > dTo)) return false;
    if(q){
      const hay = (r.nameEn+' '+r.nameAr+' '+r.brand+' '+r.code+' '+r.barcode).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });

  syncThenSelect();
  const sort = sortSelect.value;
  filtered.sort((a,b)=> groupCompare(a,b) || sortCompare(a,b,sort));

  groupCounts = new Map();
  topGroupIds = [];
  if(groupLevels.length){
    filtered.forEach(r=>{
      groupIdsFor(r).forEach((id, i)=>{
        if(!groupCounts.has(id)){ groupCounts.set(id, 0); if(i === 0) topGroupIds.push(id); }
        groupCounts.set(id, groupCounts.get(id) + 1);
      });
    });
  }
  const mode = groupLevels.join('>');
  if(collapsedMode !== mode){   // changing the grouping starts fully expanded
    collapsedGroups = new Set();
    collapsedMode = mode;
  }

  shown = 0;
  renderPage(true);
  updateToggleAllBtn();
}

function renderPage(reset, target = PAGE_SIZE){
  if(reset){ grid.innerHTML = ''; lastGroupIds = []; }
  if(filtered.length === 0){
    grid.innerHTML = `<div class="empty-state"><span class="glyph">∅</span>No items match these filters.<br><button id="resetFromEmpty">Clear filters</button></div>`;
    document.getElementById('resetFromEmpty').onclick = clearFilters;
    loadMoreWrap.style.display = 'none';
  } else {
    let html = '';
    let visible = 0;
    while(shown < filtered.length && visible < target){
      const r = filtered[shown++];
      let hidden = false;   // true once any enclosing group is collapsed
      groupIdsFor(r).forEach((id, i)=>{
        if(id !== lastGroupIds[i]){
          lastGroupIds.length = i;
          lastGroupIds[i] = id;
          if(!hidden) html += groupHeaderHtml(groupLevels[i], i + 1, keyFor(groupLevels[i], r), id);
        }
        if(collapsedGroups.has(id)) hidden = true;
      });
      if(!hidden){ visible++; html += cardHtml(r); }
    }
    grid.insertAdjacentHTML('beforeend', html);
    loadMoreWrap.style.display = shown < filtered.length ? 'flex' : 'none';
  }
  resultCount.textContent = `${filtered.length} item${filtered.length===1?'':'s'}`;
}

function clearFilters(){
  searchInput.value = '';
  categoryFilter.value = '';
  brandFilter.value = '';
  typeFilter.value = '';
  offerFilter.value = '';
  dateField.value = 'endDate';
  dateFromInput.value = '';
  dateToInput.value = '';
  updateDateBounds();
  groupSelect.value = '';
  thenSelect.value = '';
  sortSelect.value = 'recent';
  applyFilters();
}

loadMoreBtn.addEventListener('click', ()=>renderPage(false));
[searchInput].forEach(el=>el.addEventListener('input', applyFilters));
[categoryFilter, brandFilter, typeFilter, offerFilter, groupSelect, thenSelect, sortSelect]
  .forEach(el=>el.addEventListener('change', applyFilters));
// 'input' fires as soon as a typed date is complete; 'change' covers the picker
[dateFromInput, dateToInput].forEach(el=>['input', 'change'].forEach(ev=>
  el.addEventListener(ev, ()=>{ updateDateBounds(); applyFilters(); })));
dateField.addEventListener('change', ()=>{ updateDateBounds(); applyFilters(); });
clearBtn.addEventListener('click', clearFilters);
toggleAllBtn.addEventListener('click', toggleAllGroups);
grid.addEventListener('click', e=>{
  const h = e.target.closest('.group-header');
  if(h) toggleGroup(h);
});
grid.addEventListener('keydown', e=>{
  if(e.key !== 'Enter' && e.key !== ' ') return;
  const h = e.target.closest('.group-header');
  if(h){ e.preventDefault(); toggleGroup(h); }
});

// init
populateSelect(categoryFilter, uniqueSorted('subGroup'));
populateSelect(brandFilter, uniqueSorted('brand'));
populateSelect(typeFilter, uniqueSorted('type'));
populateSelect(offerFilter, uniqueSorted('offer'));

document.getElementById('totalCount').textContent = DATA.length;
document.getElementById('brandCount').textContent = new Set(DATA.map(r=>r.brand)).size;

const actDates = DATA.map(r=>r.actDate).filter(Boolean).map(d=>new Date(d+'T00:00:00'));
MAX_ACT_DATE = actDates.length ? new Date(Math.max(...actDates)) : null;

updateDateBounds();

applyFilters();

// ---------- Theme toggle ----------
const themeBtn = document.getElementById('themeBtn');

function setTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  try{ localStorage.setItem('promoTheme', theme); }catch(e){}
}

themeBtn.addEventListener('click', ()=>{
  const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  setTheme(current === 'dark' ? 'light' : 'dark');
});

if(window.matchMedia){
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  const handleSystemChange = (e)=>{
    let stored = null;
    try{ stored = localStorage.getItem('promoTheme'); }catch(err){}
    if(stored !== 'light' && stored !== 'dark'){
      document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
    }
  };
  if(mq.addEventListener) mq.addEventListener('change', handleSystemChange);
  else if(mq.addListener) mq.addListener(handleSystemChange);
}

// ---------- Barcode scanner ----------
const scanBtn = document.getElementById('scanBtn');
const scanOverlay = document.getElementById('scanOverlay');
const scanCloseBtn = document.getElementById('scanCloseBtn');
const scanVideo = document.getElementById('scanVideo');
const scanStatus = document.getElementById('scanStatus');

let zxingLoadPromise = null;
let codeReader = null;
let scanControls = null;
let nativeStream = null;
let nativeLoopActive = false;

function ensureZXingLoaded(){
  if(window.ZXing) return Promise.resolve();
  if(zxingLoadPromise) return zxingLoadPromise;
  zxingLoadPromise = new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js';
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('Could not load the scanner library.'));
    document.head.appendChild(s);
  });
  return zxingLoadPromise;
}

// Chrome/Edge/Android expose a native, hardware-accelerated barcode
// reader (Shape Detection API) that decodes off the main JS thread --
// much faster than the pure-JS ZXing fallback below. Safari/iOS and
// older browsers don't implement it, so ZXing stays as the fallback.
async function nativeDetectorSupported(){
  if(!('BarcodeDetector' in window)) return false;
  try{
    const formats = await BarcodeDetector.getSupportedFormats();
    return Array.isArray(formats) && formats.length > 0;
  }catch(e){
    return false;
  }
}

function cameraErrorMessage(e){
  return (e && e.name === 'NotAllowedError')
    ? 'Camera permission is blocked. Tap the icon left of the address bar > Permissions > Camera > Allow, then try again.'
    : (e && e.message) ? e.message : 'Camera unavailable in this view.';
}

// Medicine packs carry GS1 codes (DataMatrix, GS1 QR, GS1-128 or a GS1 Digital
// Link URL) that pack GTIN + expiry + batch + serial into one string - search
// on the GTIN (AI 01) only. Leading zeros are dropped so a 14-digit GTIN also
// matches an item stored with its 13-digit EAN (and vice versa).
function scanToQuery(raw){
  let s = String(raw || '').trim();
  const link = s.match(/\/01\/(\d{14})(?:[\/?#]|$)/);
  if(link) return link[1].replace(/^0+/, '');
  s = s.replace(/^\][A-Za-z]\d/, '');          // symbology identifier, e.g. ]d2
  const ai = s.match(/(?:^|\x1d)\(?01\)?(\d{14})/);
  if(ai) return ai[1].replace(/^0+/, '');
  return /^\d+$/.test(s) ? s.replace(/^0+/, '') : s;
}

async function startNativeScanner(){
  const wanted = ['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf','codabar','qr_code','data_matrix'];
  let formats = wanted;
  try{
    const available = await BarcodeDetector.getSupportedFormats();
    const overlap = wanted.filter(f => available.includes(f));
    formats = overlap.length ? overlap : available;
  }catch(e){ /* keep the default wish list */ }

  const detector = new BarcodeDetector({ formats });

  nativeStream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: 'environment' } }
  });
  scanVideo.srcObject = nativeStream;
  await scanVideo.play();
  scanStatus.textContent = 'Point the camera at a barcode';

  nativeLoopActive = true;
  let detecting = false;

  const scheduleNext = (fn) => {
    if(scanVideo.requestVideoFrameCallback) scanVideo.requestVideoFrameCallback(fn);
    else setTimeout(fn, 120);
  };

  const tick = async () => {
    if(!nativeLoopActive) return;
    if(!detecting){
      detecting = true;
      try{
        const codes = await detector.detect(scanVideo);
        if(codes && codes.length){
          nativeLoopActive = false;
          searchInput.value = scanToQuery(codes[0].rawValue);
          applyFilters();
          closeScanner();
          return;
        }
      }catch(e){
        // a blurry/empty frame is normal mid-scan -- keep trying
      }
      detecting = false;
    }
    if(nativeLoopActive) scheduleNext(tick);
  };

  scheduleNext(tick);
}

async function startZXingScanner(){
  await ensureZXingLoaded();
  codeReader = new ZXing.BrowserMultiFormatReader();
  scanControls = await codeReader.decodeFromConstraints(
    { video: { facingMode: { ideal: 'environment' } } },
    scanVideo,
    (result, err, controls) => {
      if(result){
        searchInput.value = scanToQuery(result.getText());
        applyFilters();
        closeScanner();
      }
    }
  );
  scanStatus.textContent = 'Point the camera at a barcode';
}

async function openScanner(){
  scanOverlay.classList.add('open');
  scanStatus.textContent = 'Starting camera…';
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    scanStatus.textContent = 'Camera access is not available in this browser.';
    return;
  }
  const useNative = await nativeDetectorSupported();
  try{
    if(useNative) await startNativeScanner();
    else await startZXingScanner();
  } catch(e){
    scanStatus.textContent = cameraErrorMessage(e);
  }
}

function closeScanner(){
  scanOverlay.classList.remove('open');
  nativeLoopActive = false;
  if(nativeStream){
    nativeStream.getTracks().forEach(t => t.stop());
    nativeStream = null;
  }
  scanVideo.srcObject = null;
  if(scanControls){
    try{ scanControls.stop(); } catch(e){}
    scanControls = null;
  }
}

scanBtn.addEventListener('click', openScanner);
scanCloseBtn.addEventListener('click', closeScanner);
scanOverlay.addEventListener('click', (e)=>{ if(e.target === scanOverlay) closeScanner(); });

</script>
</body>
</html>
